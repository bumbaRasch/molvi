name: CI

on:
  push:
    branches: [main, phase3]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-14        # Apple Silicon (aarch64-apple-darwin) — spike #2
          - os: ubuntu-latest   # x86_64-unknown-linux-gnu — spike #1
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install JS deps
        run: npm ci

      # Tauri 2 Linux system deps (webkit2gtk-4.1, gtk, etc.) — required even for
      # `cargo check`/`clippy` because the sys-crates' build scripts probe
      # pkg-config at compile time. Plus cpal's mandatory ALSA dev headers.
      - name: Install Linux system deps (Tauri 2 + ALSA)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev pkg-config

      - name: Rust fmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Rust clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: TS typecheck
        run: npx tsc --noEmit

      - name: Frontend build
        run: npm run build
