        - listitem [ref=f139e128]:
          - generic [ref=f139e129]: "02"
          - heading "Speak" [level=3] [ref=f139e130]
          - paragraph [ref=f139e131]: molvi transcribes on your CPU. Words stream live to the overlay as you talk.
        - listitem [ref=f139e132]:
          - generic [ref=f139e133]: "03"
          - heading "Release" [level=3] [ref=f139e134]
          - paragraph [ref=f139e135]: Polished text is pasted wherever your cursor is — any app, any field.
    - generic [ref=f139e138]:
      - generic [ref=f139e139]:
        - heading "Private by design, not by promise." [level=2] [ref=f139e140]
        - paragraph [ref=f139e141]: Recognition runs 100% on your CPU. Your voice never leaves your computer — and that claim is enforced by a test suite, not a marketing sentence.
        - list [ref=f139e142]:
          - listitem [ref=f139e143]:
            - generic [ref=f139e147]: All processing happens on your device. The recognition engine makes zero network requests.
          - listitem [ref=f139e148]:
            - generic [ref=f139e152]: No telemetry, no analytics, no crash-report upload. None.
          - listitem [ref=f139e153]:
            - generic [ref=f139e157]: Logs carry metadata only — transcript text, audio, dictionary, history, and snippets are never logged.
          - listitem [ref=f139e158]:
            - generic [ref=f139e162]: "Your data stays local: history, dictionary, and snippets live in a SQLite file under your appdata. Audio is never written to disk."
      - complementary [ref=f139e163]:
        - paragraph [ref=f139e164]: "Block molvi in your firewall and dictate: recognition still works, proving nothing left the machine. Or watch your network monitor during a session — it stays silent. Or read the privacy test suite that fails the build if any transcript text reaches a log."
        - link "Read the privacy test suite" [ref=f139e165] [cursor=pointer]:
          - /url: https://github.com/bumbaRasch/molvi/blob/main/src-tauri/tests/log_privacy.rs
          - text: Read the privacy test suite
          - generic [ref=f139e166]: →
        - paragraph [ref=f139e167]: The only outbound call is the optional update check (a latest.json fetch from GitHub — turn it off in settings), plus the one-time model download from Hugging Face.
