    - generic [ref=f139e120]:
      - heading "How it works" [level=2] [ref=f139e122]
      - list [ref=f139e123]:
        - listitem [ref=f139e124]:
          - generic [ref=f139e125]: "01"
          - heading "Hold your hotkey" [level=3] [ref=f139e126]
