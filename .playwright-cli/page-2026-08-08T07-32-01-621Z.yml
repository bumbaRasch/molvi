      - heading "Как это работает" [level=2] [ref=f9e56]
      - list [ref=f9e57]:
        - listitem [ref=f9e58]:
          - generic [ref=f9e59]: "01"
          - heading "Удерживайте горячую клавишу" [level=3] [ref=f9e60]
          - paragraph [ref=f9e61]: "Нажмите и удерживайте горячую клавишу (по умолчанию: Alt + `) — появится окно диктовки."
        - listitem [ref=f9e62]:
          - generic [ref=f9e63]: "02"
          - heading "Говорите" [level=3] [ref=f9e64]
          - paragraph [ref=f9e65]: molvi расшифровывает речь на вашем процессоре. Слова появляются в окне в реальном времени, пока вы говорите.
        - listitem [ref=f9e66]:
          - generic [ref=f9e67]: "03"
          - heading "Отпустите" [level=3] [ref=f9e68]
          - paragraph [ref=f9e69]: Готовый текст вставляется там, где установлен курсор — в любое приложение, в любое поле.
    - generic [ref=f9e77]:
      - heading "Приватность по конструкции, а не по обещанию." [level=2] [ref=f9e78]
      - paragraph [ref=f9e79]: Распознавание работает на 100% на вашем процессоре. Ваш голос не покидает ваш компьютер — и это утверждение подкреплено набором тестов, а не маркетинговым заявлением.
      - list [ref=f9e80]:
        - listitem [ref=f9e81]: Вся обработка происходит на вашем устройстве. Движок распознавания не делает ни одного сетевого запроса.
        - listitem [ref=f9e82]: Никакой телеметрии, никакой аналитики, никакой отправки отчётов об ошибках. Никакой.
        - listitem [ref=f9e83]: "Ваши данные остаются локальными: история, словарь и сниппеты хранятся в файле SQLite в каталоге данных приложения. Аудио никогда не записывается на диск."
      - link "Подробнее" [ref=f9e84] [cursor=pointer]:
        - /url: "#privacy"
        - text: Подробнее
        - generic [ref=f9e85]: →
    - generic [ref=f9e87]:
      - img "Настройки molvi — язык распознавания и выбор движка" [ref=f9e89]
      - generic [ref=f9e90]:
        - heading "Говорит на вашем языке" [level=2] [ref=f9e91]
        - paragraph [ref=f9e92]: Интерфейс на 36 языках — включая арабский и иврит (письмо справа налево). Плюс более 40 языков распознавания. Ни одно другое приложение диктовки не имеет локализованного интерфейса — все остальные только на английском.
        - paragraph [ref=f9e93]:
          - strong [ref=f9e94]: Ни один другой инструмент диктовки в этой области не использует движок, созданный специально для русского языка — все остальные расшифровывают русский через мультиязычную модель.
        - link "Подробнее" [ref=f9e95] [cursor=pointer]:
          - /url: "#languages"
          - text: Подробнее
          - generic [ref=f9e96]: →
    - generic [ref=f9e98]:
      - img "Диалог первого запуска molvi" [ref=f9e100]
      - generic [ref=f9e101]:
        - heading "Больше, чем диктовка" [level=2] [ref=f9e102]
        - paragraph [ref=f9e103]: "molvi вставляет текст в любое приложение и подстраивается под ваш рабочий процесс: голосовые команды, профили для приложений, собственный словарь, сниппеты и детерминированная «умная» обработка."
        - list [ref=f9e104]:
          - listitem [ref=f9e105]: Командный режим — произнесите фразу, чтобы вызвать действие клавиатуры (отменить, копировать, вставить, новая строка, выделить всё, …). 10 действий на 5 языках.
          - listitem [ref=f9e106]: Профили для приложений — разная постобработка для каждого активного приложения.
          - listitem [ref=f9e107]: Словарь (импорт/экспорт CSV/JSON) и сниппеты (голос → фрагменты текста).
          - listitem [ref=f9e108]: "Три уровня постобработки: Raw («как есть»), Smart (детерминированная, офлайн) и Polished (с собственным эндпоинтом LLM)."
        - link "Подробнее" [ref=f9e109] [cursor=pointer]:
          - /url: "#features"
          - text: Подробнее
          - generic [ref=f9e110]: →
