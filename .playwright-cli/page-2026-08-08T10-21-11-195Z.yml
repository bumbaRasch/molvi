    - generic [ref=f101e132]:
      - generic [ref=f101e133]:
        - heading "Private by design, not by promise." [level=2] [ref=f101e134]
        - paragraph [ref=f101e135]: Recognition runs 100% on your CPU. Your voice never leaves your computer — and that claim is enforced by a test suite, not a marketing sentence.
        - list [ref=f101e136]:
          - listitem [ref=f101e137]:
            - generic [ref=f101e141]: All processing happens on your device. The recognition engine makes zero network requests.
          - listitem [ref=f101e142]:
            - generic [ref=f101e146]: No telemetry, no analytics, no crash-report upload. None.
          - listitem [ref=f101e147]:
            - generic [ref=f101e151]: Logs carry metadata only — transcript text, audio, dictionary, history, and snippets are never logged.
          - listitem [ref=f101e152]:
            - generic [ref=f101e156]: "Your data stays local: history, dictionary, and snippets live in a SQLite file under your appdata. Audio is never written to disk."
      - complementary [ref=f101e157]:
        - paragraph [ref=f101e158]: "Block molvi in your firewall and dictate: recognition still works, proving nothing left the machine. Or watch your network monitor during a session — it stays silent. Or read the privacy test suite that fails the build if any transcript text reaches a log."
        - link "Read the privacy test suite" [ref=f101e159] [cursor=pointer]:
          - /url: https://github.com/bumbaRasch/molvi/blob/main/src-tauri/tests/log_privacy.rs
          - text: Read the privacy test suite
          - generic [ref=f101e160]: →
        - paragraph [ref=f101e161]: The only outbound call is the optional update check (a latest.json fetch from GitHub — turn it off in settings), plus the one-time model download from Hugging Face.
