          - paragraph [ref=f119e135]: Polished text is pasted wherever your cursor is — any app, any field.
    - generic [ref=f119e138]:
      - generic [ref=f119e139]:
        - heading "Private by design, not by promise." [level=2] [ref=f119e140]
        - paragraph [ref=f119e141]: Recognition runs 100% on your CPU. Your voice never leaves your computer — and that claim is enforced by a test suite, not a marketing sentence.
        - list [ref=f119e142]:
          - listitem [ref=f119e143]:
            - generic [ref=f119e147]: All processing happens on your device. The recognition engine makes zero network requests.
          - listitem [ref=f119e148]:
            - generic [ref=f119e152]: No telemetry, no analytics, no crash-report upload. None.
          - listitem [ref=f119e153]:
            - generic [ref=f119e157]: Logs carry metadata only — transcript text, audio, dictionary, history, and snippets are never logged.
          - listitem [ref=f119e158]:
            - generic [ref=f119e162]: "Your data stays local: history, dictionary, and snippets live in a SQLite file under your appdata. Audio is never written to disk."
      - complementary [ref=f119e163]:
        - paragraph [ref=f119e164]: "Block molvi in your firewall and dictate: recognition still works, proving nothing left the machine. Or watch your network monitor during a session — it stays silent. Or read the privacy test suite that fails the build if any transcript text reaches a log."
        - link "Read the privacy test suite" [ref=f119e165] [cursor=pointer]:
          - /url: https://github.com/bumbaRasch/molvi/blob/main/src-tauri/tests/log_privacy.rs
          - text: Read the privacy test suite
          - generic [ref=f119e166]: →
        - paragraph [ref=f119e167]: The only outbound call is the optional update check (a latest.json fetch from GitHub — turn it off in settings), plus the one-time model download from Hugging Face.
