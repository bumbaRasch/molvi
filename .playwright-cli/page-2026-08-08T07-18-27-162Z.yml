    - generic [ref=e455]:
      - generic [ref=e456]:
        - heading "Known limitations" [level=2] [ref=e457]
        - paragraph [ref=e458]: Honest about where molvi isn’t ahead.
      - list [ref=e459]:
        - listitem [ref=e460]: ⚠ First run downloads the model (~2.6 GB Nemotron default / ~225 MB GigaAM). It is not bundled, to keep the installer tiny.
        - listitem [ref=e461]: ⚠ Installers are unsigned at the OS level (SmartScreen/Gatekeeper one-time bypass). Update payloads are ed25519-signed; OS code-signing is planned.
        - listitem [ref=e462]: ⚠ macOS Apple Silicon only. No Intel build (an upstream runtime limitation).
        - listitem [ref=e463]: "⚠ Linux: X11 is fully supported. Under Wayland, foreground-app detection and paste-focus fall back to global settings."
        - listitem [ref=e464]: "⚠ Nemotron punctuation: streaming emits commas only — no terminal periods. Use GigaAM for punctuated Russian, or Polished mode with your own LLM."
        - listitem [ref=e465]: ⚠ Desktop only. No iOS/Android.
        - listitem [ref=e466]: ⚠ No bundled LLM polish. Polished mode is bring-your-own endpoint (Ollama, LM Studio, any OpenAI-compatible server).
