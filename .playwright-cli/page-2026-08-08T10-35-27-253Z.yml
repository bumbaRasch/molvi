    - generic [ref=f160e191]:
      - generic [ref=f160e192]:
        - heading "Private by design, not by promise." [level=2] [ref=f160e193]
        - paragraph [ref=f160e194]: Recognition runs 100% on your CPU. Your voice never leaves your computer — and that claim is enforced by a test suite, not a marketing sentence.
        - list [ref=f160e195]:
          - listitem [ref=f160e196]:
            - generic [ref=f160e200]: All processing happens on your device. The recognition engine makes zero network requests.
          - listitem [ref=f160e201]:
            - generic [ref=f160e205]: No telemetry, no analytics, no crash-report upload. None.
          - listitem [ref=f160e206]:
            - generic [ref=f160e210]: Logs carry metadata only — transcript text, audio, dictionary, history, and snippets are never logged.
          - listitem [ref=f160e211]:
            - generic [ref=f160e215]: "Your data stays local: history, dictionary, and snippets live in a SQLite file under your appdata. Audio is never written to disk."
      - complementary [ref=f160e216]:
        - paragraph [ref=f160e217]: "Block molvi in your firewall and dictate: recognition still works, proving nothing left the machine. Or watch your network monitor during a session — it stays silent. Or read the privacy test suite that fails the build if any transcript text reaches a log."
        - link "Read the privacy test suite" [ref=f160e218] [cursor=pointer]:
          - /url: https://github.com/bumbaRasch/molvi/blob/main/src-tauri/tests/log_privacy.rs
          - text: Read the privacy test suite
          - generic [ref=f160e219]: →
        - paragraph [ref=f160e220]: The only outbound call is the optional update check (a latest.json fetch from GitHub — turn it off in settings), plus the one-time model download from Hugging Face.
