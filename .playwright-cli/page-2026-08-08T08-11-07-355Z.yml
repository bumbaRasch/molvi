          - paragraph [ref=f76e69]: Готовый текст вставляется там, где установлен курсор — в любое приложение, в любое поле.
    - generic [ref=f76e77]:
      - heading "Приватность по конструкции, а не по обещанию." [level=2] [ref=f76e78]
      - paragraph [ref=f76e79]: Распознавание работает на 100% на вашем процессоре. Ваш голос не покидает ваш компьютер — и это утверждение подкреплено набором тестов, а не маркетинговым заявлением.
      - list [ref=f76e80]:
        - listitem [ref=f76e81]: Вся обработка происходит на вашем устройстве. Движок распознавания не делает ни одного сетевого запроса.
        - listitem [ref=f76e82]: Никакой телеметрии, никакой аналитики, никакой отправки отчётов об ошибках. Никакой.
        - listitem [ref=f76e83]: "Ваши данные остаются локальными: история, словарь и сниппеты хранятся в файле SQLite в каталоге данных приложения. Аудио никогда не записывается на диск."
      - link "Подробнее" [ref=f76e84] [cursor=pointer]:
        - /url: "#privacy"
        - text: Подробнее
        - generic [ref=f76e85]: →
    - generic [ref=f76e87]:
      - img "Настройки molvi — язык распознавания и выбор движка" [ref=f76e89]
      - generic [ref=f76e90]:
        - heading "Говорит на вашем языке" [level=2] [ref=f76e91]
        - paragraph [ref=f76e92]: Интерфейс на 36 языках — включая арабский и иврит (письмо справа налево). Плюс более 40 языков распознавания. Ни одно другое приложение диктовки не имеет локализованного интерфейса — все остальные только на английском.
        - paragraph [ref=f76e93]:
          - strong [ref=f76e94]: Ни один другой инструмент диктовки в этой области не использует движок, созданный специально для русского языка — все остальные расшифровывают русский через мультиязычную модель.
        - link "Подробнее" [ref=f76e95] [cursor=pointer]:
          - /url: "#languages"
          - text: Подробнее
          - generic [ref=f76e96]: →
    - generic [ref=f76e98]:
      - img "Диалог первого запуска molvi" [ref=f76e100]
      - generic [ref=f76e101]:
        - heading "Больше, чем диктовка" [level=2] [ref=f76e102]
        - paragraph [ref=f76e103]: "molvi вставляет текст в любое приложение и подстраивается под ваш рабочий процесс: голосовые команды, профили для приложений, собственный словарь, сниппеты и детерминированная «умная» обработка."
        - list [ref=f76e104]:
          - listitem [ref=f76e105]: Командный режим — произнесите фразу, чтобы вызвать действие клавиатуры (отменить, копировать, вставить, новая строка, выделить всё, …). 10 действий на 5 языках.
          - listitem [ref=f76e106]: Профили для приложений — разная постобработка для каждого активного приложения.
          - listitem [ref=f76e107]: Словарь (импорт/экспорт CSV/JSON) и сниппеты (голос → фрагменты текста).
          - listitem [ref=f76e108]: "Три уровня постобработки: Raw («как есть»), Smart (детерминированная, офлайн) и Polished (с собственным эндпоинтом LLM)."
        - link "Подробнее" [ref=f76e109] [cursor=pointer]:
          - /url: "#features"
          - text: Подробнее
