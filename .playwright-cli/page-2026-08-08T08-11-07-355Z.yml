      - paragraph [ref=f76e454]: molvi построен на той же базе распознавания речи на Rust (transcribe-rs), что и Handy — родительский проект. Мы считаем Handy родственной разработкой, а не соперником, которого нужно превзойти.
    - generic [ref=f76e456]:
      - generic [ref=f76e457]:
        - heading "Известные ограничения" [level=2] [ref=f76e458]
        - paragraph [ref=f76e459]: Честно о том, в чём molvi не впереди.
      - list [ref=f76e460]:
        - listitem [ref=f76e461]: ⚠ При первом запуске загружается модель (~2,6 ГБ для Nemotron по умолчанию / ~225 МБ для GigaAM). Она не входит в комплект, чтобы установщик оставался компактным.
        - listitem [ref=f76e462]: ⚠ Установщики не подписаны на уровне ОС (разовый обход SmartScreen/Gatekeeper). Полезные обновления подписаны ed25519; подписывание на уровне ОС в планах.
        - listitem [ref=f76e463]: ⚠ macOS — только Apple Silicon. Сборки для Intel нет (ограничение вышележащей среды выполнения).
        - listitem [ref=f76e464]: "⚠ Linux: X11 полностью поддерживается. В Wayland определение активного приложения и фокус вставки fallback к глобальным настройкам."
        - listitem [ref=f76e465]: "⚠ Пунктуация Nemotron: потоковая передача выдаёт только запятые — без точек в конце. Используйте GigaAM для пунктуации русского или режим Polished со своим LLM."
        - listitem [ref=f76e466]: ⚠ Только десктоп. Нет iOS/Android.
        - listitem [ref=f76e467]: ⚠ Нет встроенной LLM-полировки. Режим Polished предполагает собственный эндпоинт (Ollama, LM Studio, любой OpenAI-совместимый сервер).
