    - generic [ref=f128e138]:
      - generic [ref=f128e139]:
        - heading "Приватность по конструкции, а не по обещанию." [level=2] [ref=f128e140]
        - paragraph [ref=f128e141]: Распознавание работает на 100% на вашем процессоре. Ваш голос не покидает ваш компьютер — и это утверждение подкреплено набором тестов, а не маркетинговым заявлением.
        - list [ref=f128e142]:
          - listitem [ref=f128e143]:
            - generic [ref=f128e147]: Вся обработка происходит на вашем устройстве. Движок распознавания не делает ни одного сетевого запроса.
          - listitem [ref=f128e148]:
            - generic [ref=f128e152]: Никакой телеметрии, никакой аналитики, никакой отправки отчётов об ошибках. Никакой.
          - listitem [ref=f128e153]:
            - generic [ref=f128e157]: Логи содержат только метаданные — текст расшифровки, аудио, словарь, история и сниппеты никогда не записываются в логи.
          - listitem [ref=f128e158]:
            - generic [ref=f128e162]: "Ваши данные остаются локальными: история, словарь и сниппеты хранятся в файле SQLite в каталоге данных приложения. Аудио никогда не записывается на диск."
      - complementary [ref=f128e163]:
        - paragraph [ref=f128e164]: "Заблокируйте molvi в брандмауэре и надиктуйте: распознавание продолжит работать, доказывая, что ничего не покинуло компьютер. Или следите за сетевым монитором во время сессии — он остаётся тихим. Или прочитайте набор тестов приватности, который ломает сборку, если какой-либо текст расшифровки попадает в лог."
        - link "Читать набор тестов приватности" [ref=f128e165] [cursor=pointer]:
          - /url: https://github.com/bumbaRasch/molvi/blob/main/src-tauri/tests/log_privacy.rs
          - text: Читать набор тестов приватности
