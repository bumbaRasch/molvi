    - generic [ref=f151e191]:
      - generic [ref=f151e192]:
        - heading "Private by design, not by promise." [level=2] [ref=f151e193]
        - paragraph [ref=f151e194]: Recognition runs 100% on your CPU. Your voice never leaves your computer — and that claim is enforced by a test suite, not a marketing sentence.
        - list [ref=f151e195]:
          - listitem [ref=f151e196]:
            - generic [ref=f151e200]: All processing happens on your device. The recognition engine makes zero network requests.
          - listitem [ref=f151e201]:
            - generic [ref=f151e205]: No telemetry, no analytics, no crash-report upload. None.
          - listitem [ref=f151e206]:
            - generic [ref=f151e210]: Logs carry metadata only — transcript text, audio, dictionary, history, and snippets are never logged.
          - listitem [ref=f151e211]:
            - generic [ref=f151e215]: "Your data stays local: history, dictionary, and snippets live in a SQLite file under your appdata. Audio is never written to disk."
      - complementary [ref=f151e216]:
        - paragraph [ref=f151e217]: "Block molvi in your firewall and dictate: recognition still works, proving nothing left the machine. Or watch your network monitor during a session — it stays silent. Or read the privacy test suite that fails the build if any transcript text reaches a log."
        - link "Read the privacy test suite" [ref=f151e218] [cursor=pointer]:
          - /url: https://github.com/bumbaRasch/molvi/blob/main/src-tauri/tests/log_privacy.rs
          - text: Read the privacy test suite
          - generic [ref=f151e219]: →
        - paragraph [ref=f151e220]: The only outbound call is the optional update check (a latest.json fetch from GitHub — turn it off in settings), plus the one-time model download from Hugging Face.
