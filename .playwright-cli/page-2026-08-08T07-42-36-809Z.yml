        - listitem [ref=f33e66]:
          - generic [ref=f33e67]: "03"
          - heading "Отпустите" [level=3] [ref=f33e68]
          - paragraph [ref=f33e69]: Готовый текст вставляется там, где установлен курсор — в любое приложение, в любое поле.
    - generic [ref=f33e77]:
      - heading "Приватность по конструкции, а не по обещанию." [level=2] [ref=f33e78]
      - paragraph [ref=f33e79]: Распознавание работает на 100% на вашем процессоре. Ваш голос не покидает ваш компьютер — и это утверждение подкреплено набором тестов, а не маркетинговым заявлением.
      - list [ref=f33e80]:
        - listitem [ref=f33e81]: Вся обработка происходит на вашем устройстве. Движок распознавания не делает ни одного сетевого запроса.
        - listitem [ref=f33e82]: Никакой телеметрии, никакой аналитики, никакой отправки отчётов об ошибках. Никакой.
        - listitem [ref=f33e83]: "Ваши данные остаются локальными: история, словарь и сниппеты хранятся в файле SQLite в каталоге данных приложения. Аудио никогда не записывается на диск."
      - link "Подробнее" [ref=f33e84] [cursor=pointer]:
        - /url: "#privacy"
        - text: Подробнее
        - generic [ref=f33e85]: →
    - generic [ref=f33e87]:
      - img "Настройки molvi — язык распознавания и выбор движка" [ref=f33e89]
      - generic [ref=f33e90]:
        - heading "Говорит на вашем языке" [level=2] [ref=f33e91]
        - paragraph [ref=f33e92]: Интерфейс на 36 языках — включая арабский и иврит (письмо справа налево). Плюс более 40 языков распознавания. Ни одно другое приложение диктовки не имеет локализованного интерфейса — все остальные только на английском.
        - paragraph [ref=f33e93]:
          - strong [ref=f33e94]: Ни один другой инструмент диктовки в этой области не использует движок, созданный специально для русского языка — все остальные расшифровывают русский через мультиязычную модель.
        - link "Подробнее" [ref=f33e95] [cursor=pointer]:
          - /url: "#languages"
          - text: Подробнее
          - generic [ref=f33e96]: →
    - generic [ref=f33e98]:
      - img "Диалог первого запуска molvi" [ref=f33e100]
      - generic [ref=f33e101]:
        - heading "Больше, чем диктовка" [level=2] [ref=f33e102]
        - paragraph [ref=f33e103]: "molvi вставляет текст в любое приложение и подстраивается под ваш рабочий процесс: голосовые команды, профили для приложений, собственный словарь, сниппеты и детерминированная «умная» обработка."
        - list [ref=f33e104]:
          - listitem [ref=f33e105]: Командный режим — произнесите фразу, чтобы вызвать действие клавиатуры (отменить, копировать, вставить, новая строка, выделить всё, …). 10 действий на 5 языках.
          - listitem [ref=f33e106]: Профили для приложений — разная постобработка для каждого активного приложения.
          - listitem [ref=f33e107]: Словарь (импорт/экспорт CSV/JSON) и сниппеты (голос → фрагменты текста).
          - listitem [ref=f33e108]: "Три уровня постобработки: Raw («как есть»), Smart (детерминированная, офлайн) и Polished (с собственным эндпоинтом LLM)."
        - link "Подробнее" [ref=f33e109] [cursor=pointer]:
          - /url: "#features"
          - text: Подробнее
