      - list [ref=f33e57]:
        - listitem [ref=f33e58]:
          - generic [ref=f33e59]: "01"
          - heading "Удерживайте горячую клавишу" [level=3] [ref=f33e60]
          - paragraph [ref=f33e61]: "Нажмите и удерживайте горячую клавишу (по умолчанию: Alt + `) — появится окно диктовки."
        - listitem [ref=f33e62]:
          - generic [ref=f33e63]: "02"
