      - generic [ref=f162e197]:
        - heading "Private by design, not by promise." [level=2] [ref=f162e198]
        - paragraph [ref=f162e199]: Recognition runs 100% on your CPU. Your voice never leaves your computer — and that claim is enforced by a test suite, not a marketing sentence.
        - list [ref=f162e200]:
          - listitem [ref=f162e201]:
            - generic [ref=f162e205]: All processing happens on your device. The recognition engine makes zero network requests.
          - listitem [ref=f162e206]:
            - generic [ref=f162e210]: No telemetry, no analytics, no crash-report upload. None.
          - listitem [ref=f162e211]:
            - generic [ref=f162e215]: Logs carry metadata only — transcript text, audio, dictionary, history, and snippets are never logged.
          - listitem [ref=f162e216]:
            - generic [ref=f162e220]: "Your data stays local: history, dictionary, and snippets live in a SQLite file under your appdata. Audio is never written to disk."
      - complementary [ref=f162e221]:
        - paragraph [ref=f162e222]: "Block molvi in your firewall and dictate: recognition still works, proving nothing left the machine. Or watch your network monitor during a session — it stays silent. Or read the privacy test suite that fails the build if any transcript text reaches a log."
        - link "Read the privacy test suite" [ref=f162e223] [cursor=pointer]:
          - /url: https://github.com/bumbaRasch/molvi/blob/main/src-tauri/tests/log_privacy.rs
          - text: Read the privacy test suite
          - generic [ref=f162e224]: →
        - paragraph [ref=f162e225]: The only outbound call is the optional update check (a latest.json fetch from GitHub — turn it off in settings), plus the one-time model download from Hugging Face.
