        - heading "Speaks your language" [level=2] [ref=f42e91]
        - paragraph [ref=f42e92]: A 36-language interface — including Arabic and Hebrew, right-to-left. Plus 40+ recognition locales. No other dictation app ships a localized UI; the rest are English-only.
        - paragraph [ref=f42e93]:
          - strong [ref=f42e94]: No other dictation tool in this space runs a Russian-native engine — everyone else transcribes Russian through a multilingual model.
