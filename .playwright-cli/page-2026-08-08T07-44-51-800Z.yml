    - generic [ref=f42e77]:
      - heading "Private by design, not by promise." [level=2] [ref=f42e78]
      - paragraph [ref=f42e79]: Recognition runs 100% on your CPU. Your voice never leaves your computer — and that claim is enforced by a test suite, not a marketing sentence.
      - list [ref=f42e80]:
        - listitem [ref=f42e81]: All processing happens on your device. The recognition engine makes zero network requests.
        - listitem [ref=f42e82]: No telemetry, no analytics, no crash-report upload. None.
        - listitem [ref=f42e83]: "Your data stays local: history, dictionary, and snippets live in a SQLite file under your appdata. Audio is never written to disk."
      - link "Learn more" [ref=f42e84] [cursor=pointer]:
        - /url: "#privacy"
        - text: Learn more
