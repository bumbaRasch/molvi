      - generic [ref=f42e101]:
        - heading "More than dictation" [level=2] [ref=f42e102]
        - paragraph [ref=f42e103]: "molvi pastes into any app and bends to your workflow: voice commands, per-app profiles, a custom dictionary, snippets, and deterministic Smart clean-up."
        - list [ref=f42e104]:
          - listitem [ref=f42e105]: Command mode — say a phrase, trigger a keyboard action (undo, copy, paste, new line, select-all, …). 10 actions across 5 languages.
          - listitem [ref=f42e106]: Per-app profiles — different post-processing per foreground application.
          - listitem [ref=f42e107]: Dictionary (CSV/JSON import/export) and snippets (voice → text blocks).
          - listitem [ref=f42e108]: "Three post-processing tiers: Raw, Smart (deterministic, offline), and Polished (bring-your-own LLM endpoint)."
        - link "Learn more" [ref=f42e109] [cursor=pointer]:
