    - generic [ref=f42e456]:
      - generic [ref=f42e457]:
        - heading "Known limitations" [level=2] [ref=f42e458]
        - paragraph [ref=f42e459]: Honest about where molvi isn’t ahead.
      - list [ref=f42e460]:
        - listitem [ref=f42e461]: ⚠ First run downloads the model (~2.6 GB Nemotron default / ~225 MB GigaAM). It is not bundled, to keep the installer tiny.
        - listitem [ref=f42e462]: ⚠ Installers are unsigned at the OS level (SmartScreen/Gatekeeper one-time bypass). Update payloads are ed25519-signed; OS code-signing is planned.
        - listitem [ref=f42e463]: ⚠ macOS Apple Silicon only. No Intel build (an upstream runtime limitation).
        - listitem [ref=f42e464]: "⚠ Linux: X11 is fully supported. Under Wayland, foreground-app detection and paste-focus fall back to global settings."
        - listitem [ref=f42e465]: "⚠ Nemotron punctuation: streaming emits commas only — no terminal periods. Use GigaAM for punctuated Russian, or Polished mode with your own LLM."
        - listitem [ref=f42e466]: ⚠ Desktop only. No iOS/Android.
        - listitem [ref=f42e467]: ⚠ No bundled LLM polish. Polished mode is bring-your-own endpoint (Ollama, LM Studio, any OpenAI-compatible server).
