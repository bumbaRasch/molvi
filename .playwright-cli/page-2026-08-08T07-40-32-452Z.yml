    - generic [ref=f24e77]:
      - heading "Private by design, not by promise." [level=2] [ref=f24e78]
      - paragraph [ref=f24e79]: Recognition runs 100% on your CPU. Your voice never leaves your computer — and that claim is enforced by a test suite, not a marketing sentence.
      - list [ref=f24e80]:
        - listitem [ref=f24e81]: All processing happens on your device. The recognition engine makes zero network requests.
        - listitem [ref=f24e82]: No telemetry, no analytics, no crash-report upload. None.
        - listitem [ref=f24e83]: "Your data stays local: history, dictionary, and snippets live in a SQLite file under your appdata. Audio is never written to disk."
      - link "Learn more" [ref=f24e84] [cursor=pointer]:
        - /url: "#privacy"
        - text: Learn more
