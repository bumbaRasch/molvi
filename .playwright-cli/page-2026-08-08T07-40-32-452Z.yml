      - generic [ref=f24e101]:
        - heading "More than dictation" [level=2] [ref=f24e102]
        - paragraph [ref=f24e103]: "molvi pastes into any app and bends to your workflow: voice commands, per-app profiles, a custom dictionary, snippets, and deterministic Smart clean-up."
        - list [ref=f24e104]:
          - listitem [ref=f24e105]: Command mode — say a phrase, trigger a keyboard action (undo, copy, paste, new line, select-all, …). 10 actions across 5 languages.
          - listitem [ref=f24e106]: Per-app profiles — different post-processing per foreground application.
          - listitem [ref=f24e107]: Dictionary (CSV/JSON import/export) and snippets (voice → text blocks).
          - listitem [ref=f24e108]: "Three post-processing tiers: Raw, Smart (deterministic, offline), and Polished (bring-your-own LLM endpoint)."
        - link "Learn more" [ref=f24e109] [cursor=pointer]:
          - /url: "#features"
          - text: Learn more
