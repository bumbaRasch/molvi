      - generic [ref=f24e90]:
        - heading "Speaks your language" [level=2] [ref=f24e91]
        - paragraph [ref=f24e92]: A 36-language interface — including Arabic and Hebrew, right-to-left. Plus 40+ recognition locales. No other dictation app ships a localized UI; the rest are English-only.
        - paragraph [ref=f24e93]:
          - strong [ref=f24e94]: No other dictation tool in this space runs a Russian-native engine — everyone else transcribes Russian through a multilingual model.
        - link "Learn more" [ref=f24e95] [cursor=pointer]:
