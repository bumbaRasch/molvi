    - generic [ref=f67e456]:
      - generic [ref=f67e457]:
        - heading "Known limitations" [level=2] [ref=f67e458]
        - paragraph [ref=f67e459]: Honest about where molvi isn’t ahead.
      - list [ref=f67e460]:
        - listitem [ref=f67e461]: ⚠ First run downloads the model (~2.6 GB Nemotron default / ~225 MB GigaAM). It is not bundled, to keep the installer tiny.
        - listitem [ref=f67e462]: ⚠ Installers are unsigned at the OS level (SmartScreen/Gatekeeper one-time bypass). Update payloads are ed25519-signed; OS code-signing is planned.
        - listitem [ref=f67e463]: ⚠ macOS Apple Silicon only. No Intel build (an upstream runtime limitation).
        - listitem [ref=f67e464]: "⚠ Linux: X11 is fully supported. Under Wayland, foreground-app detection and paste-focus fall back to global settings."
        - listitem [ref=f67e465]: "⚠ Nemotron punctuation: streaming emits commas only — no terminal periods. Use GigaAM for punctuated Russian, or Polished mode with your own LLM."
        - listitem [ref=f67e466]: ⚠ Desktop only. No iOS/Android.
        - listitem [ref=f67e467]: ⚠ No bundled LLM polish. Polished mode is bring-your-own endpoint (Ollama, LM Studio, any OpenAI-compatible server).
