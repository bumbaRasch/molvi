    - generic [ref=f67e77]:
      - heading "Private by design, not by promise." [level=2] [ref=f67e78]
      - paragraph [ref=f67e79]: Recognition runs 100% on your CPU. Your voice never leaves your computer — and that claim is enforced by a test suite, not a marketing sentence.
      - list [ref=f67e80]:
        - listitem [ref=f67e81]: All processing happens on your device. The recognition engine makes zero network requests.
        - listitem [ref=f67e82]: No telemetry, no analytics, no crash-report upload. None.
        - listitem [ref=f67e83]: "Your data stays local: history, dictionary, and snippets live in a SQLite file under your appdata. Audio is never written to disk."
      - link "Learn more" [ref=f67e84] [cursor=pointer]:
        - /url: "#privacy"
        - text: Learn more
        - generic [ref=f67e85]: →
    - generic [ref=f67e87]:
      - img "molvi settings — recognition language and engine selection" [ref=f67e89]
      - generic [ref=f67e90]:
        - heading "Speaks your language" [level=2] [ref=f67e91]
        - paragraph [ref=f67e92]: A 36-language interface — including Arabic and Hebrew, right-to-left. Plus 40+ recognition locales. No other dictation app ships a localized UI; the rest are English-only.
        - paragraph [ref=f67e93]:
          - strong [ref=f67e94]: No other dictation tool in this space runs a Russian-native engine — everyone else transcribes Russian through a multilingual model.
        - link "Learn more" [ref=f67e95] [cursor=pointer]:
          - /url: "#languages"
          - text: Learn more
          - generic [ref=f67e96]: →
    - generic [ref=f67e98]:
      - img "molvi first-run onboarding dialog" [ref=f67e100]
      - generic [ref=f67e101]:
        - heading "More than dictation" [level=2] [ref=f67e102]
        - paragraph [ref=f67e103]: "molvi pastes into any app and bends to your workflow: voice commands, per-app profiles, a custom dictionary, snippets, and deterministic Smart clean-up."
        - list [ref=f67e104]:
          - listitem [ref=f67e105]: Command mode — say a phrase, trigger a keyboard action (undo, copy, paste, new line, select-all, …). 10 actions across 5 languages.
          - listitem [ref=f67e106]: Per-app profiles — different post-processing per foreground application.
          - listitem [ref=f67e107]: Dictionary (CSV/JSON import/export) and snippets (voice → text blocks).
          - listitem [ref=f67e108]: "Three post-processing tiers: Raw, Smart (deterministic, offline), and Polished (bring-your-own LLM endpoint)."
        - link "Learn more" [ref=f67e109] [cursor=pointer]:
          - /url: "#features"
          - text: Learn more
          - generic [ref=f67e110]: →
